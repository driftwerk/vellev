# Every dependency must be permissively licensed: vellev ships inside customer
# installs. Copyleft and source-available licences (GPL, AGPL, BUSL, SSPL,
# ELv2) are refused by not being listed.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

# MPL-2.0 is copyleft for the crate's own files only. It is used unchanged,
# so what it asks of a binary shipped to a customer is a notice of where
# that crate's source can be had. It comes in through the model
# downloader's choice of cache directory.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

# `paste` is finished rather than abandoned: a small macro crate with no
# known fault, used by the tokenizer the local model needs.
#
# `quick-xml` 0.38, which `object_store` 0.12 pins, takes quadratic time on
# a start tag with many attributes and unbounded memory on one with many
# namespace declarations. It parses only what the node's own object store
# answers, which the node trusts with its data already; a store that sent
# such XML could withhold the data outright. The fixed `quick-xml` comes
# with the next `object_store`.
[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
