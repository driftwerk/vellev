# Every dependency must be permissively licensed: vellev ships inside customer
# installs. Copyleft and source-available licences (GPL, AGPL, BUSL, SSPL,
# ELv2) are refused by not being listed.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

# MPL-2.0 binds only changes to the crate's own files, and it is used as
# published. It comes in through the model downloader's choice of cache
# directory.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
