# Every dependency must be permissively licensed: vellev ships inside customer
# installs. Copyleft and source-available licences (GPL, AGPL, BUSL, SSPL,
# ELv2) are refused by not being listed.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

# MPL-2.0 is copyleft for the crate's own files only. It is used unchanged,
# so what it asks of a binary shipped to a customer is a notice of where
# that crate's source can be had. It comes in through the model
# downloader's choice of cache directory.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

# `paste` is finished rather than abandoned: a small macro crate with no
# known fault, used by the tokenizer the local model needs.
#
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195 are each a denial of service of
# the node by its own object store, through `quick_xml::de`, which
# `object_store` 0.12.5 uses to read the store's answers to a listing, a
# multipart upload and an error: 0194, a quadratic check for repeated
# attributes on one start tag, pins a worker thread for as long as the tag
# is long; 0195, an unbounded allocation per namespace declaration, takes
# the node's memory. Neither reads or alters data. The store is the node's
# own, trusted with its data already, and `object_store` 0.12.5 pins
# `quick-xml` 0.38, so nothing short of the next `object_store` fixes it;
# `cargo update` cannot. Revisit by 2026-11-09: DW-670.
[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
