[package]
name = "vellev-api"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = true
description = "The HTTP API types of the vellev vector database"
keywords = ["vector", "database", "search", "embeddings"]
categories = ["database"]

[features]
openapi = ["dep:utoipa", "vellev-core/openapi", "vellev-index/openapi"]

[dependencies]
vellev-core.workspace = true
vellev-index.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
utoipa = { workspace = true, optional = true }
