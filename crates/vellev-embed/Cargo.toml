[package]
name = "vellev-embed"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
license = "FSL-1.1-ALv2"

[features]
default = ["local"]
local = ["dep:fastembed", "dep:hf-hub"]

[dependencies]
vellev-core.workspace = true

async-trait.workspace = true
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sso", "credentials-process"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
fastembed = { version = "5", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures.workspace = true
# Only to know its errors by type: keep it the version fastembed fetches
# models with, or a cache that cannot be written is no longer recognised.
# A test in local.rs fails if Cargo.lock comes to hold two.
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
