[package]
name = "vellev-embed"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
license = "FSL-1.1-ALv2"

[features]
default = ["local"]
local = ["dep:fastembed", "dep:hf-hub"]
# Runs local models on an NVIDIA GPU through ONNX Runtime's CUDA provider,
# which fails to load rather than falling back to the CPU. Only for
# one-off jobs such as embedding the benchmark fixture: it needs the CUDA
# and cuDNN libraries ONNX Runtime's CUDA build is linked against.
cuda = ["local", "dep:ort", "ort/cuda"]
# A clock a test moves by hand, and the hooks that hand one in: for this
# crate's own tests, and those of crates that test through it.
test-clock = []

[dependencies]
vellev-core.workspace = true

async-trait.workspace = true
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "sso", "credentials-process"] }
# Only to know an error of its by type: credentials that could not be
# loaded are reported as a failure to send, like a region not reached.
aws-credential-types = "1"
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
fastembed = { version = "5", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures.workspace = true
# Only to know its errors by type: keep it the version fastembed fetches
# models with, or a cache that cannot be written is no longer recognised.
# A test in local.rs fails if Cargo.lock comes to hold two.
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq"] }
# Only for the `cuda` feature: keep it the version fastembed runs models
# with, so the CUDA provider is that of the same ONNX Runtime.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false }
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# Its own tests move a clock by hand.
vellev-embed = { path = ".", features = ["test-clock"] }
axum.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
