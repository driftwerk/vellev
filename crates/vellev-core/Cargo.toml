[package]
name = "vellev-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = true
description = "Shared types of the vellev vector database: ids, schemas, objects and values"
keywords = ["vector", "database", "search", "embeddings"]
categories = ["database"]

[features]
openapi = ["dep:utoipa"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
uuid.workspace = true

# On x86-64 the hash uses the SHA extensions when the processor has them;
# on aarch64 that takes the assembly backend.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
