name: Retention planted (scratch)

on:
  push:
    branches: [scratch-retention-planted]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p vellev --bin vellev && cargo test --locked -p vellev --test allocator --no-run
      - name: as CI ran it, RUST_BACKTRACE=1, twice
        run: |
          for i in 1 2; do RUST_BACKTRACE=1 cargo test --locked -p vellev --test allocator -- --nocapture 2>&1 | grep -E "scratch:|^test |test result" || true; done
      - name: RUST_BACKTRACE=0, twice
        run: |
          for i in 1 2; do RUST_BACKTRACE=0 cargo test --locked -p vellev --test allocator -- --nocapture 2>&1 | grep -E "scratch:|^test |test result" || true; done
      - name: RUST_BACKTRACE=1, the nm test skipped
        run: |
          RUST_BACKTRACE=1 cargo test --locked -p vellev --test allocator -- --nocapture --skip the_node_binary 2>&1 | grep -E "scratch:|^test |test result" || true
      - name: RUST_BACKTRACE=1, the nm test alone first in the same process is impossible; run with one thread (nm first)
        run: |
          RUST_BACKTRACE=1 cargo test --locked -p vellev --test allocator -- --nocapture --test-threads 1 2>&1 | grep -E "scratch:|^test |test result" || true
