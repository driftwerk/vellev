name: ONNX Runtime stage (scratch)

on:
  push:
    branches: [scratch-ort-stage]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The image's ONNX Runtime stage, built afresh
        run: docker build --no-cache --progress=plain --target onnxruntime -t ort-stage . 2>&1 | grep -E "onnxruntime.sh|ERROR"
