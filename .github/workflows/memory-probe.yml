name: Memory probe (scratch)

# Scratch probes of where vellev's memory goes at scale: not for merging.
on:
  push:
    branches: [scratch-memory-2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WEAVIATE_IMAGE: cr.weaviate.io/semitechnologies/weaviate:1.40.2@sha256:0083587dc01f33112e5406ce9b471df1abea480c71a0407af903929a389ae08a
  POSTGRES_IMAGE: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
  FIXTURE: fixture-bench-wiki1m-bge-base-v1

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jemalloc-1m
            rows: '1000000'
            heaptrack: false
            extra: ''

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Disk cleanup
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && docker image prune -af > /dev/null
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vellev:bench
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: matrix.heaptrack
        run: docker build -f Dockerfile.heaptrack -t vellev:heaptrack .
      - run: cargo build --release --locked -p vellev-bench
      - name: Fetch the fixture
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fixture"
          mkdir -p "$F/download" "$F/text" "$F/vectors" "$F/truth"
          cd "$F/download"
          wanted="passages.jsonl.zst queries.jsonl warmup.jsonl vectors-queries.tar.zst vectors-passages-0.tar.zst vectors-passages-1.tar.zst vectors-passages-2.tar.zst truth.jsonl.zst"
          for asset in $wanted; do
            gh release download "$FIXTURE" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
            grep "  $asset\$" "$GITHUB_WORKSPACE/scripts/bench-fixture/SHA256SUMS" >> wanted.sha256
          done
          sha256sum --check --strict wanted.sha256
          zstd -q -d --long=31 passages.jsonl.zst -o "$F/text/passages.jsonl"
          mv queries.jsonl warmup.jsonl "$F/text/"
          for part in vectors-*.tar.zst; do
            zstd -q -dc "$part" | tar -C "$F/vectors" -xf - --exclude='._*' --warning=no-unknown-keyword
            rm "$part"
          done
          zstd -q -d truth.jsonl.zst -o "$F/truth/truth.jsonl"
      - name: Run
        run: |
          mkdir -p "$RUNNER_TEMP/profile" && chmod 0777 "$RUNNER_TEMP/profile"
          image=vellev:bench
          mount=""
          if [ "${{ matrix.heaptrack }}" = true ]; then image=vellev:heaptrack; mount="--vellev-mount $RUNNER_TEMP/profile:/profile"; fi
          taskset -c 3 target/release/vellev-bench --gate-only --limits 10 --reps 1 \
            --fixture "$RUNNER_TEMP/fixture" --truth "$RUNNER_TEMP/fixture/truth/truth.jsonl" --rows ${{ matrix.rows }} \
            --out "$RUNNER_TEMP/results" --data "$RUNNER_TEMP/engines" \
            --vellev-image $image --weaviate-image "$WEAVIATE_IMAGE" --postgres-image "$POSTGRES_IMAGE" \
            ${{ matrix.extra }} $mount 2>&1 | grep -vE "^vellev limit|recall" || true
          ls -la "$RUNNER_TEMP/profile"
      - if: matrix.heaptrack
        name: What the heap holds
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q heaptrack > /dev/null
          f=$(ls "$RUNNER_TEMP"/profile/vellev* | head -1)
          heaptrack_print -f "$f" --print-peaks 1 --print-allocators 0 --print-leaks 0 --print-temporary 0 --peak-limit 40 -s 0 2>&1 | head -400
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/profile
            ${{ runner.temp }}/results
          retention-days: 14
          if-no-files-found: ignore

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probe-heaptrack-300k
          run-id: 40581203997
          github-token: ${{ github.token }}
          path: probe
      - run: sudo apt-get update -q && sudo apt-get install -y -q heaptrack > /dev/null
      - name: What vellev still held at its end
        run: |
          f=$(find probe -name 'vellev*' | head -1)
          heaptrack_print -f "$f" --print-peaks 0 --print-allocators 0 --print-leaks 1 --print-temporary 0 --peak-limit 30 2>&1 | grep -vE "^\s+in /|at /rustc|core::ops::function|std::rt|tokio::runtime|std::panic|__rust|futures_util|<core::pin" | cut -c1-220 | head -400
      - name: What its peak was made of, with callers
        run: |
          f=$(find probe -name 'vellev*' | head -1)
          heaptrack_print -f "$f" --print-peaks 1 --print-allocators 0 --print-leaks 0 --print-temporary 0 --peak-limit 12 2>&1 | grep -E "peak memory consumed|vellev_|^  and" | cut -c1-200 | head -200
