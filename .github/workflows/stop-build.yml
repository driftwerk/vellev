name: Stop build cost (scratch)

on:
  push:
    branches: [scratch-stop-build]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FIXTURE: fixture-bench-wiki1m-bge-base-v1

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Build after, and before (main)
        run: |
          cargo build --release --locked -p vellev-index --example build_peak && cp target/release/examples/build_peak "$RUNNER_TEMP/after"
          git worktree add "$RUNNER_TEMP/before-src" origin/main
          cp crates/vellev-index/examples/build_peak.rs "$RUNNER_TEMP/before-src/crates/vellev-index/examples/"
          (cd "$RUNNER_TEMP/before-src" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --locked -p vellev-index --example build_peak) && cp target/release/examples/build_peak "$RUNNER_TEMP/before"
      - name: Fetch the fixture's vectors
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fixture"
          mkdir -p "$F/download" "$F/vectors"
          cd "$F/download"
          for asset in vectors-passages-0.tar.zst vectors-passages-1.tar.zst vectors-passages-2.tar.zst; do
            gh release download "$FIXTURE" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
            grep "  $asset\$" "$GITHUB_WORKSPACE/scripts/bench-fixture/SHA256SUMS" >> wanted.sha256
          done
          sha256sum --check --strict wanted.sha256
          for part in vectors-*.tar.zst; do
            zstd -q -dc "$part" | tar -C "$F/vectors" -xf - --exclude='._*' --warning=no-unknown-keyword
            rm "$part"
          done
      - name: CPU and memory
        run: lscpu | grep -E "Model name|^CPU\(s\)"; free -g
      - name: Before and after, alternately, three times
        run: |
          for side in before after before after before after; do
            echo "== $side"
            /usr/bin/time -v "$RUNNER_TEMP/$side" "$RUNNER_TEMP/fixture" 1000000 2> time.txt
            grep -E "Maximum resident|Elapsed" time.txt
          done
