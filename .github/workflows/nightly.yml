name: Nightly

# The simulation and the storage property test at a far higher case count
# than the per-commit run, to reach histories the short run does not, and a
# look for dependencies with newly reported faults, which would otherwise
# fail unrelated commits.
on:
  workflow_dispatch:
    inputs:
      fail:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PROPTEST_CASES: ${{ inputs.cases || '20000' }}

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ inputs.fail }}" != true ]'
  recall:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  advisories:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  report:
    name: Report
    needs: [simulation, recall, advisories]
    # Runs after a failed job, but not when the run itself was cancelled,
    # and only for the default branch: a manual run on another branch, or
    # with a few cases, must not close or add to the nightly's issue.
    if: ${{ !cancelled() && github.ref == 'refs/heads/scratch-des8-report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two reports at once could both find no open issue and open two.
    concurrency:
      group: nightly-report
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SIMULATION: ${{ needs.simulation.result }}
      RECALL: ${{ needs.recall.result }}
      ADVISORIES: ${{ needs.advisories.result }}
    steps:
      - name: Open, update or close the red-nightly issue
        run: |
          set -euo pipefail
          open=$(gh issue list --label nightly-red --state open --json number --jq '.[].number')
          if [ "$SIMULATION" = success ] && [ "$RECALL" = success ] && [ "$ADVISORIES" = success ]; then
            for n in $open; do
              gh issue close "$n" --comment "The nightly is green again: $RUN_URL"
            done
            exit 0
          fi
          body="The nightly is red: simulation ${SIMULATION}, recall ${RECALL}, advisories ${ADVISORIES}. $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "${open%%$'\n'*}" --body "$body"
          else
            gh label create nightly-red --color B60205 \
              --description "The nightly workflow is failing" 2>/dev/null || true
            gh issue create --label nightly-red \
              --title "Nightly is red" --body "$body"
          fi
