name: Nightly

# The simulation and the storage property test at a far higher case count
# than the per-commit run, to reach histories the short run does not, and a
# look for dependencies with newly reported faults, which would otherwise
# fail unrelated commits.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: Histories to generate per property test
        type: number
        default: 20000

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PROPTEST_CASES: ${{ inputs.cases || '20000' }}

jobs:
  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p vellev-storage --test simulation --test partition
      # A failing history is shrunk and written next to the test; keep it so
      # it can be committed as a regression seed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: crates/vellev-storage/tests/*.proptest-regressions
          if-no-files-found: ignore

  # The default rescore budget's recall on real embeddings: the SQuAD 2.0
  # fixture (CC BY-SA 4.0, see scripts/recall-fixture/ATTRIBUTION.md), fetched
  # from its release and checked against the checksums committed here.
  recall:
    name: Recall on real embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FIXTURE: fixture-recall-squad2-bge-base-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the fixture and check it
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          gh release download "$FIXTURE" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zst' --pattern ATTRIBUTION.md
          sha256sum --check --strict "$GITHUB_WORKSPACE/scripts/recall-fixture/SHA256SUMS"
          zstd --decompress --rm -- *.zst
      - name: Recall gate
        run: cargo test --release --locked -p vellev-storage --test recall_fixture -- --ignored --nocapture
        env:
          VELLEV_RECALL_FIXTURE: ${{ runner.temp }}/fixture/memories.jsonl
          VELLEV_RECALL_QUERIES: ${{ runner.temp }}/fixture/queries.vectors.jsonl

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
