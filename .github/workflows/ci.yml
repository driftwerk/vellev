name: CI

on:
  # Every pull request, including one stacked on another branch.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vellev
          POSTGRES_PASSWORD: vellev
          POSTGRES_DB: vellev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vellev"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      VELLEV_TEST_DATABASE_URL: postgres://vellev:vellev@127.0.0.1:5432/vellev
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  deny:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vellev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image's own health check is the only probe ECS and Swarm get, so
      # prove a container built from this commit reports healthy, and that
      # what it then serves can be written to and read back.
      - name: Container reports healthy and serves
        run: |
          set -euo pipefail
          docker network create vellev
          docker run -d --name postgres --network vellev \
            -e POSTGRES_USER=vellev -e POSTGRES_PASSWORD=vellev -e POSTGRES_DB=vellev \
            postgres:16-alpine
          docker run -d --name vellev --network vellev --restart on-failure \
            --health-interval=1s -p 8080:8080 \
            -e VELLEV_DATABASE_URL=postgres://vellev:vellev@postgres:5432/vellev \
            -e VELLEV_STORE=file:///var/lib/vellev/cache/store \
            -e VELLEV_API_KEYS=ci-key \
            vellev:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' vellev)
            [ "$status" = healthy ] && break
            sleep 1
          done
          if [ "$status" != healthy ]; then
            docker logs vellev
            echo "::error::container never became healthy (last status: $status)"
            exit 1
          fi
          # Healthy means the process is up; ready means it has reached Postgres.
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/health/ready && break
            sleep 1
          done
          call() { curl -fsS -H 'authorization: Bearer ci-key' -H 'content-type: application/json' "$@"; }
          notes=http://127.0.0.1:8080/v1/tenants/ci/collections/notes
          call -X PUT http://127.0.0.1:8080/v1/tenants/ci
          call -X PUT "$notes" -d '{"name":"notes","properties":[{"name":"title","data_type":"text","searchable":true}],"embedding":{"provider":"none","model":"client","dimensions":2}}'
          call -X PUT "$notes/objects/00000000-0000-0000-0000-000000000001" -d '{"properties":{"title":"a red fox"},"vector":[1,0]}'
          call -X POST "$notes/hybrid" -d '{"text":"fox","vector":[1,0],"limit":1}' | tee /dev/stderr | grep -q '"a red fox"'

  weaviate:
    name: Weaviate
    runs-on: ubuntu-latest
    # The release workforce runs; vellev answers as it does.
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.36.8
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: node1
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      VELLEV_WEAVIATE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vellev --test weaviate --locked -- --nocapture
