name: CI

on:
  # Every pull request, including one stacked on another branch.
  pull_request:
  push:
    branches: [main]
  # A release is checked by the same gates first.
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debug info for every test binary and example fills the runner's
  # disk; line tables are enough for a backtrace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  # The crates published to crates.io package on their own, against one
  # another as crates.io will serve them.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked -p vellev-core -p vellev-index -p vellev-api -p vellev-client

  # The release's publish script, against a crates.io served from fixtures.
  publish-script:
    name: Publish script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/publish-crate.test.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vellev
          POSTGRES_PASSWORD: vellev
          POSTGRES_DB: vellev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vellev"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      VELLEV_TEST_DATABASE_URL: postgres://vellev:vellev@127.0.0.1:5432/vellev
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # What a score costs is only told optimised, so the index's tests that
      # time it are left out above and run here: one small crate and what
      # it depends on, built without debug info, and its timings printed.
      - name: Index tests, optimised
        run: cargo test --release --locked -p vellev-index --lib -- --nocapture
      # What a merge reckons it holds, held to what a counting allocator
      # measures over a score of merges, and what its whole build holds
      # tokenized in chunks, weighed against every row tokenized at once, up
      # to 200,000 rows: built for debugging, the merges take far too long,
      # so the rules are left out above and run here.
      - name: Merge reckoning and tokenizing, optimised
        run: |
          cargo test --release --locked -p vellev-storage --test flush_memory -- \
            --ignored --nocapture --exact \
            a_merge_reckons_what_it_holds_at_its_peak_within_thirty_percent \
            a_merge_holds_a_chunk_of_tokens_at_once_and_its_whole_build_no_more_for_it \
            | tee reckoning.log
          # The rules ran, both: not left out by their names or their ignore.
          grep -q "test result: ok. 2 passed" reckoning.log

  # The benchmark fixture's tools, on tiny hand-made data.
  fixture-scripts:
    name: Fixture scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.3
      - run: python -W error::ResourceWarning -m unittest discover -s scripts/bench-fixture -p 'test_*.py'

  # The ONNX Runtime the image links: pinned as the locked ort-sys's own,
  # and fetched, checked and unpacked as the rules say.
  onnxruntime:
    name: ONNX Runtime pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/deps/onnxruntime.test.sh

  deny:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vellev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image's own health check is the only probe ECS and Swarm get, so
      # prove a container built from this commit reports healthy, and that
      # what it then serves can be written to and read back.
      - name: Container reports healthy and serves
        run: |
          set -euo pipefail
          docker network create vellev
          docker run -d --name postgres --network vellev \
            -e POSTGRES_USER=vellev -e POSTGRES_PASSWORD=vellev -e POSTGRES_DB=vellev \
            postgres:16-alpine
          docker run -d --name vellev --network vellev --restart on-failure \
            --health-interval=1s -p 8080:8080 \
            -e VELLEV_DATABASE_URL=postgres://vellev:vellev@postgres:5432/vellev \
            -e VELLEV_STORE=file:///var/lib/vellev/cache/store \
            -e VELLEV_API_KEYS=ci-key \
            vellev:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' vellev)
            [ "$status" = healthy ] && break
            sleep 1
          done
          if [ "$status" != healthy ]; then
            docker logs vellev
            echo "::error::container never became healthy (last status: $status)"
            exit 1
          fi
          # Healthy means the process is up; ready means it has reached Postgres.
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/health/ready && break
            sleep 1
          done
          call() { curl -fsS -H 'authorization: Bearer ci-key' -H 'content-type: application/json' "$@"; }
          notes=http://127.0.0.1:8080/v1/tenants/ci/collections/notes
          call -X PUT http://127.0.0.1:8080/v1/tenants/ci
          call -X PUT "$notes" -d '{"name":"notes","properties":[{"name":"title","data_type":"text","searchable":true}],"embedding":{"provider":"none","model":"client","dimensions":2}}'
          call -X PUT "$notes/objects/00000000-0000-0000-0000-000000000001" -d '{"properties":{"title":"a red fox"},"vector":[1,0]}'
          call -X POST "$notes/hybrid" -d '{"text":"fox","vector":[1,0],"limit":1}' | tee /dev/stderr | grep -q '"a red fox"'

  weaviate:
    name: Weaviate
    runs-on: ubuntu-latest
    # The release workforce runs; vellev answers as it does.
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.36.8
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: node1
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      VELLEV_WEAVIATE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vellev --test weaviate --test import --locked -- --nocapture

  # The image every gate above passed is pushed for the commit it was built
  # from, so a deployment pins `sha-<commit>` and never moves by accident.
  # Not on a pull request: a fork's has no secrets, and nothing should pin
  # an image of a commit that is not on main or tagged.
  push-image:
    name: Push image
    if: github.event_name == 'push'
    needs: [fmt, package, publish-script, clippy, test, onnxruntime, deny, image, weaviate]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.IMAGE_REPOSITORY || 'kingsleyh/vellev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Built again from the layers the `image` job cached, so what is
      # pushed is what that job started and wrote to.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
