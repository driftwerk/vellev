name: Merge pool nice (scratch)

on:
  push:
    branches: [scratch-step3-nice-plant, scratch-step3-nice]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  nice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: The merge pool rules, on Linux
        run: cargo test --locked -p vellev-index --test merge_pool --test merge_pool_nice -- --nocapture
