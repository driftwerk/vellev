name: Step 3 plants (scratch)

# Every plant of #169, each alone and one filtered test, on one head, so as
# to spare the machine it is written on. Not for merging.
on:
  push:
    branches: [scratch-step3-bench]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 1

jobs:
  plants:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Disk cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af > /dev/null
          df -h /
      - uses: Swatinem/rust-cache@v2
      - name: Plants
        run: python3 scripts/step3-bench/plants.py | tee plants.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-plants
          path: |
            plants.jsonl
            plants.log
          retention-days: 90
          if-no-files-found: ignore
