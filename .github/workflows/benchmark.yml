name: Benchmark

# vellev against Weaviate at matched recall (design r2, PR 3). Both engines
# run in one job on one runner, one after the other, each pinned to CPUs
# 0-2 with the client on CPU 3. The fixture (CC BY-SA 4.0, see
# scripts/bench-fixture/ATTRIBUTION.md) is fetched from its release every
# run and checked against the checksums committed here; the Actions cache
# is never used for it.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      rows:
        description: Passages to load, from the first (1000000 or 100000)
        type: choice
        options: ['1000000', '100000']
        default: '1000000'
      tuned:
        description: Weaviate's tuned build (maxConnections 64, efConstruction 256)
        type: boolean
        default: false
  pull_request:
    paths:
      - crates/vellev-bench/**
      - scripts/bench-fixture/**
      - .github/workflows/benchmark.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Newest stable Weaviate, by digest, bumped deliberately by a PR (§1).
  WEAVIATE_IMAGE: cr.weaviate.io/semitechnologies/weaviate:1.40.2@sha256:0083587dc01f33112e5406ce9b471df1abea480c71a0407af903929a389ae08a
  POSTGRES_IMAGE: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
  FIXTURE: fixture-bench-wiki1m-bge-base-v1

jobs:
  # The harness end to end on a synthetic 5,000-row fixture made on the
  # runner: that it brings both engines up, loads, settles, measures and
  # reports. Its numbers say nothing about either engine.
  harness:
    name: Harness on synthetic data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vellev:bench
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.3
      - name: Synthetic fixture
        run: python scripts/bench-fixture/synthetic.py "$RUNNER_TEMP/fixture" --rows 5000 --queries 50
      - run: cargo build --release --locked -p vellev-bench
      - name: Run
        run: |
          taskset -c 3 target/release/vellev-bench \
            --fixture "$RUNNER_TEMP/fixture" --truth "$RUNNER_TEMP/fixture/truth/truth.jsonl" \
            --rows 5000 --out "$RUNNER_TEMP/results" --data "$RUNNER_TEMP/engines" \
            --vellev-image vellev:bench --weaviate-image "$WEAVIATE_IMAGE" --postgres-image "$POSTGRES_IMAGE" \
            --reps 1 || status=$?
          cat "$RUNNER_TEMP/results/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          # The gate is not held on synthetic data: only a run that did not
          # finish fails here.
          test -f "$RUNNER_TEMP/results/results.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-synthetic
          path: ${{ runner.temp }}/results
          retention-days: 90
          if-no-files-found: ignore

  # The benchmark itself, on the published fixture: nightly on 1M rows, or
  # on demand.
  benchmark:
    name: Benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ROWS: ${{ inputs.rows || '1000000' }}
      TUNED: ${{ inputs.tuned && '--tuned' || '' }}
    steps:
      - uses: actions/checkout@v5
      # The runner's preinstalled toolchains the job does not use (§7).
      - name: Disk cleanup
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
          docker image prune -af > /dev/null
          df -h /
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vellev:bench
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: cargo build --release --locked -p vellev-bench
      # Downloaded from the release every run and checked against the
      # checksums committed here; never kept in the Actions cache (§7).
      - name: Fetch the fixture and check it
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fixture"
          mkdir -p "$F/download" "$F/text" "$F/vectors" "$F/truth"
          cd "$F/download"
          case "$ROWS" in
            1000000) parts="vectors-passages-0.tar.zst vectors-passages-1.tar.zst vectors-passages-2.tar.zst"; truth=truth.jsonl ;;
            100000) parts="vectors-passages-0.tar.zst"; truth=truth-100000.jsonl ;;
            *) echo "::error::no fixture slice of $ROWS rows"; exit 1 ;;
          esac
          wanted="ATTRIBUTION.md manifest.json passages.jsonl.zst queries.jsonl warmup.jsonl vectors-queries.tar.zst $truth.zst $parts"
          for asset in $wanted; do
            gh release download "$FIXTURE" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          done
          for asset in $wanted; do
            grep "  $asset\$" "$GITHUB_WORKSPACE/scripts/bench-fixture/SHA256SUMS"
          done > wanted.sha256
          test "$(wc -l < wanted.sha256)" -eq "$(echo $wanted | wc -w)"
          sha256sum --check --strict wanted.sha256
          zstd -q -d --long=31 passages.jsonl.zst -o "$F/text/passages.jsonl"
          mv queries.jsonl warmup.jsonl "$F/text/"
          for part in $parts vectors-queries.tar.zst; do
            zstd -q -dc "$part" | tar -C "$F/vectors" -xf -
            rm "$part"
          done
          zstd -q -d "$truth.zst" -o "$F/truth/$truth"
          echo "TRUTH=$F/truth/$truth" >> "$GITHUB_ENV"
          rm -rf "$F/download"
          ls "$F/vectors/passages" | wc -l
          df -h /
      # The many-tenants measure runs on the SQuAD recall fixture (§3e),
      # fetched and checked the same way.
      - name: Fetch the recall fixture and check it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recall"
          cd "$RUNNER_TEMP/recall"
          gh release download fixture-recall-squad2-bge-base-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zst' --pattern ATTRIBUTION.md
          sha256sum --check --strict "$GITHUB_WORKSPACE/scripts/recall-fixture/SHA256SUMS"
          zstd --decompress --rm -q -- *.zst
          df -h /
      - name: Run
        run: |
          set -o pipefail
          taskset -c 3 target/release/vellev-bench \
            --fixture "$RUNNER_TEMP/fixture" --truth "$TRUTH" --rows "$ROWS" \
            --tenants "$RUNNER_TEMP/recall" \
            --out "$RUNNER_TEMP/results" --data "$RUNNER_TEMP/engines" \
            --vellev-image vellev:bench --weaviate-image "$WEAVIATE_IMAGE" --postgres-image "$POSTGRES_IMAGE" \
            $TUNED 2>&1 | tee "$RUNNER_TEMP/run.log"
      - if: always()
        run: cat "$RUNNER_TEMP/results/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/run.log
          retention-days: 90
          if-no-files-found: ignore
