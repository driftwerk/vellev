name: Tuning rule (scratch)

on:
  push:
    branches: [scratch-tuning-rule]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p vellev-index --test pool
      - if: always()
        run: cargo test --locked -p vellev-index --test pool_first
