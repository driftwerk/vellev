name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  # The release is checked by the same gates as main, services included.
  test:
    name: Verify
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    env:
      # In dependency order. The server's crates are not published.
      CRATES: vellev-core vellev-index vellev-api vellev-client
    steps:
      - uses: actions/checkout@v5

      # The release tag names the client's version, which leads the set.
      - name: Check the tag matches the workspace
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "vellev-client") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match vellev-client $version"
            exit 1
          fi

      # Nothing is published unless every crate can be: a version crates.io
      # has from another commit would otherwise fail midway, after the
      # crates before it were published for good.
      - name: Check no crate's version is taken
        run: |
          for crate in $CRATES; do
            .github/scripts/publish-crate.sh --check "$crate"
          done

      - name: Publish the crates in dependency order
        run: |
          for crate in $CRATES; do
            .github/scripts/publish-crate.sh "$crate"
          done

  # The release's image is the one CI pushed for this commit, named again by
  # its version: nothing is built twice, and `sha-<commit>` and the version
  # are the same image.
  image:
    name: Name the image by its version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: publish
    env:
      IMAGE: ${{ vars.IMAGE_REPOSITORY || 'kingsleyh/vellev' }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_REF_NAME#v}" \
            "$IMAGE:sha-$GITHUB_SHA"
