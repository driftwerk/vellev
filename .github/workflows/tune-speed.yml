name: Tune speed (scratch)

on:
  push:
    branches: [scratch-tune-speed]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FIXTURE: fixture-bench-wiki1m-bge-base-v1

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p vellev-index --example tune_speed && cp target/release/examples/tune_speed "$RUNNER_TEMP/tune_speed"
      - name: Fetch the fixture's vectors and the questions
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fixture"
          mkdir -p "$F/download" "$F/vectors"
          cd "$F/download"
          for asset in vectors-queries.tar.zst vectors-passages-0.tar.zst vectors-passages-1.tar.zst vectors-passages-2.tar.zst; do
            gh release download "$FIXTURE" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
            grep "  $asset\$" "$GITHUB_WORKSPACE/scripts/bench-fixture/SHA256SUMS" >> wanted.sha256
          done
          sha256sum --check --strict wanted.sha256
          for part in vectors-*.tar.zst; do
            zstd -q -dc "$part" | tar -C "$F/vectors" -xf - --exclude='._*' --warning=no-unknown-keyword
            rm "$part"
          done
          ls "$F/vectors/passages" | wc -l
      - name: CPU
        run: lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-200
      - name: Reads during a rows pass, one tuning thread against the global pool, alternately, three times each
        run: |
          for mode in global tune global tune global tune; do
            if [ $mode = global ]; then export SCRATCH_GLOBAL_TUNING=1; else unset SCRATCH_GLOBAL_TUNING; fi
            echo "== $mode"; RAYON_NUM_THREADS=3 "$RUNNER_TEMP/tune_speed" "$RUNNER_TEMP/fixture" 912500 560
          done
