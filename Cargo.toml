[workspace]
resolver = "2"
members = [
    "crates/vellev",
    "crates/vellev-api",
    "crates/vellev-client",
    "crates/vellev-core",
    "crates/vellev-embed",
    "crates/vellev-index",
    "crates/vellev-node",
    "crates/vellev-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/driftwerk/vellev"
publish = false

[workspace.dependencies]
base64 = "0.22"
vellev-api = { path = "crates/vellev-api", version = "0.1.0" }
vellev-client = { path = "crates/vellev-client", version = "0.1.0" }
vellev-core = { path = "crates/vellev-core", version = "0.1.0" }
vellev-embed = { path = "crates/vellev-embed", version = "0.1.0" }
vellev-index = { path = "crates/vellev-index", version = "0.1.0" }
vellev-node = { path = "crates/vellev-node", version = "0.1.0" }
vellev-storage = { path = "crates/vellev-storage", version = "0.1.0" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bytemuck = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = "0.3"
http-body-util = "0.1"
memmap2 = "0.9"
object_store = { version = "0.12", features = ["aws"] }
proptest = "1"
rayon = "1"
rmp-serde = "1"
roaring = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
jsonwebtoken = "9"
ring = "0.17"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
tracing-subscriber = { version = "0.3", features = ["json"] }
